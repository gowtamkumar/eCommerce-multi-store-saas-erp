services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multi_tenant_ecommerce
      TZ: "GMT"
      PGTZ: "GMT"
    ports:
      - "5434:5432"
    networks:
      - main_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: server-dev
    ports:
      - "3900:3900"
    env_file:
      - ./server/.env.development
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - main_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: client-dev
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.local
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    networks:
      - main_network

networks:
  main_network:
    driver: bridge

volumes:
  postgres_data:
