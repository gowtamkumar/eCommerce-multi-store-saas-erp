services:
  postgres:
    image: postgres:17-alpine
    container_name: multi_tenant_postgres_db_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multi_tenant_ecommerce
      TZ: "GMT"
      PGTZ: "GMT"
    ports:
      - "5434:5432"
    networks:
      - multi_tenant_main_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  pgadmin:
    container_name: multi_tenant_pgadmin_ecommerce
    image: dpage/pgadmin4:latest
    profiles:
      - debug
    environment:
      - PGADMIN_DEFAULT_EMAIL=gowtampaul0@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=gowtampaul1995@
    ports:
      - "5051:80"
    depends_on:
      - postgres
    networks:
      - multi_tenant_main_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 200M

  redis:
    image: redis:7-alpine
    container_name: multi_tenant_redis_dev
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data # Optional: Persist Redis data
    networks:
      - multi_tenant_main_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: multi_tenant_redis_commander_dev
    profiles:
      - debug
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8088:8081"
    depends_on:
      - redis
    networks:
      - multi_tenant_main_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 100M

  minio:
    image: minio/minio:latest
    container_name: multi_tenant_minio_dev
    restart: "no"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multi_tenant_main_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # mailhog:
  #   image: mailhog/mailhog:latest
  #   container_name: multi_tenant_mailhog_dev
  #   restart: "no"
  #   profiles:
  #     - debug
  #   ports:
  #     - "1025:1025"
  #     - "8025:8025"
  #   networks:
  #     - multi_tenant_main_network
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.10'
  #         memory: 64M

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: multi_tenant_server_dev
    restart: "no"
    ports:
      - "3900:3900"
    env_file:
      - ./server/.env.development
    volumes:
      - ./server:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis
    networks:
      - multi_tenant_main_network
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1.5G

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: multi_tenant_client_dev
    restart: "no"
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.local
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    networks:
      - multi_tenant_main_network
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2G

networks:
  multi_tenant_main_network:
    driver: bridge

volumes:
  postgres_data:
  redis-data:
  minio_data:
