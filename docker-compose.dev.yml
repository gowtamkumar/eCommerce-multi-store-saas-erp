services:
  postgres:
    image: postgres:17-alpine
    container_name: multi_tenant_postgres_db_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multi_tenant_ecommerce
      TZ: "GMT"
      PGTZ: "GMT"
    ports:
      - "5434:5432"
    networks:
      - multi_tenant_main_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    container_name: multi_tenant_pgadmin_ecommerce
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=gowtampaul0@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=gowtampaul1995@
    ports:
      - "5051:80"
    depends_on:
      - postgres
    networks:
      - multi_tenant_main_network

  redis:
    image: redis:7-alpine
    container_name: multi_tenant_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data # Optional: Persist Redis data
    networks:
      - multi_tenant_main_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: multi_tenant_redis_commander_dev
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8088:8081"
    depends_on:
      - redis
    networks:
      - multi_tenant_main_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: multi_tenant_server_dev
    ports:
      - "3900:3900"
    env_file:
      - ./server/.env.development
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - multi_tenant_main_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: multi_tenant_client_dev
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.local
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    networks:
      - multi_tenant_main_network

networks:
  multi_tenant_main_network:
    driver: bridge

volumes:
  postgres_data:
  redis-data:
