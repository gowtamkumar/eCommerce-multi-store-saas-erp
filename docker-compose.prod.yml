services:
  # MongoDB Database (Production)
  mongodb:
    image: mongo:7.0
    container_name: eCommerce-multi-tenant-saasmongodb-prod
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ecommerce
    volumes:
      - mongodb_prod_data:/data/db
      - mongodb_prod_config:/data/configdb
    networks:
      - eCommerce-multi-tenant-saasnetwork-prod
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

  # Mongo Express (Production - Optional, for database management)
  mongo-express:
    image: mongo-express
    container_name: mongo-express-prod
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_ADMIN_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_ADMIN_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - eCommerce-multi-tenant-saasnetwork-prod
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Next.js Application (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MONGODB_URI: ${MONGODB_URI}
    container_name: eCommerce-multi-tenant-saasapp-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV={NODE_ENV}
      - MONGODB_URI=${MONGODB_URI}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SEED_DB=${SEED_DB}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - STORE_ID=${STORE_ID}
      - STORE_PASSWORD=${STORE_PASSWORD}
      - IS_LIVE=${IS_LIVE}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - eCommerce-multi-tenant-saasnetwork-prod
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  eCommerce-multi-tenant-saasnetwork-prod:
    driver: bridge

volumes:
  mongodb_prod_data:
    driver: local
  mongodb_prod_config:
    driver: local
  uploads_data:
    driver: local
